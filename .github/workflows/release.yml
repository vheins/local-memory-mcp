name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/
      - run: npm install --legacy-peer-deps
      # REFACTOR-TST-013: publish is gated on the same checks as CI —
      # never publish a regression (type-check + lint + full suite).
      - run: npm run type-check
      - run: npm run lint
      # FIX-393: same grammar-WASM prerequisite as CI — the
      # reference-emission tests need dist/grammars (kotlin/swift/dart/vue
      # have no prebuilt WASM in node_modules), so build before the gate.
      - run: bash scripts/copy-grammar-wasm.sh
      - run: npm run test
      - run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844 # v1
        with:
          generate_release_notes: true
